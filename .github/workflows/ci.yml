name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  NEXT_PUBLIC_CONTACT_PHONE: "+50767340816"
  NEXT_PUBLIC_CONTACT_WHATSAPP: "+50767340816"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # next-env.d.ts no está en git (docs Next 16): typegen lo genera antes de tsc
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npx vitest run tests/unit

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 } # la versión que generó config.toml; el default de la action (2.20) no la lee
      - run: npm ci
      - run: supabase start
      - run: npx vitest run tests/rls tests/unit/queries.test.ts

  build-and-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 } # la versión que generó config.toml; el default de la action (2.20) no la lee
      - run: npm ci
      - run: supabase start
      - run: npm run build
      - run: npx @lhci/cli@0.14.x autorun
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
